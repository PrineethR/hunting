<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Close-up texture of layered paper pages and stitched linen binding">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3ece0" />
      <stop offset="100%" stop-color="#e7dcc9" />
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a24c35" />
      <stop offset="100%" stop-color="#873a26" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)" />
  <!-- Linen hardcover spine strip -->
  <path d="M 40 36 Q 112 46 130 332 L 40 340 Z" fill="url(#cloth)" />
  <!-- Stitched binding cord -->
  <path d="M 122 52 Q 140 186 144 326" fill="none" stroke="#c8b08d" stroke-width="5" stroke-dasharray="10 7" />
  <!-- Fanned paper edges -->
  <g stroke="#705946" stroke-width="1.35" fill="none" opacity="0.72">
    <path d="M 132 48 C 258 32, 412 46, 598 70" />
    <path d="M 134 64 C 264 48, 418 62, 604 88" />
    <path d="M 136 80 C 268 65, 422 79, 608 106" />
    <path d="M 138 97 C 272 82, 426 96, 612 125" />
    <path d="M 140 114 C 275 100, 430 114, 614 144" />
    <path d="M 141 132 C 278 118, 434 132, 616 163" />
    <path d="M 143 150 C 280 137, 436 151, 617 183" />
    <path d="M 144 169 C 282 156, 438 170, 618 202" />
    <path d="M 145 188 C 284 176, 440 190, 618 222" />
    <path d="M 146 208 C 286 196, 442 210, 618 242" />
    <path d="M 147 228 C 287 216, 443 230, 617 262" />
    <path d="M 148 248 C 288 237, 444 251, 616 283" />
    <path d="M 149 268 C 289 258, 445 272, 614 303" />
    <path d="M 150 288 C 290 279, 446 293, 610 323" />
  </g>
  <!-- Subtle ink margin lines on top open sheet -->
  <g stroke="#9b8774" stroke-width="1" opacity="0.35">
    <line x1="210" y1="86" x2="510" y2="112" />
    <line x1="214" y1="106" x2="480" y2="128" />
    <line x1="218" y1="126" x2="520" y2="152" />
  </g>
  <!-- Bookmark ribbon -->
  <path d="M 380 42 L 408 44 L 392 248 L 376 230 L 360 246 Z" fill="#b45136" opacity="0.9" />
</svg>
