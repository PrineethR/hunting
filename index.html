<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFF2E6" />
    <title>Courtyard Trail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stationery">
      <div id="global-alert" class="whisper-alert hidden" role="alert">
        <p id="global-alert-text"></p>
      </div>

      <section id="screen-loading" class="screen-center" aria-live="polite">
        <div class="loading-dots" aria-label="Loading">
          <span></span><span></span><span></span>
        </div>
      </section>

      <section id="screen-welcome" class="screen-center screen-enter hidden">
        <svg
          class="botanical-mark"
          viewBox="0 0 88 56"
          fill="none"
          aria-hidden="true"
        >
          <path
            class="sprig-stem"
            d="M12 44 C 28 38, 44 26, 74 14"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
          />
          <path
            class="sprig-leaf leaf-1"
            d="M28 36 C 24 27, 30 20, 38 24 C 36 31, 32 35, 28 36 Z"
            stroke="currentColor"
            stroke-width="1.1"
            stroke-linejoin="round"
          />
          <path
            class="sprig-leaf leaf-2"
            d="M44 27 C 46 17, 54 14, 58 21 C 53 26, 48 27, 44 27 Z"
            stroke="currentColor"
            stroke-width="1.1"
            stroke-linejoin="round"
          />
          <path
            class="sprig-leaf leaf-3"
            d="M46 28 C 54 30, 58 38, 50 42 C 45 38, 45 32, 46 28 Z"
            stroke="currentColor"
            stroke-width="1.1"
            stroke-linejoin="round"
          />
          <circle
            class="sprig-bud"
            cx="74"
            cy="14"
            r="2.4"
            fill="currentColor"
          />
        </svg>

        <h1 id="welcome-title" class="editorial-title"></h1>
        <p id="welcome-copy" class="editorial-subtitle"></p>

        <form id="start-form" class="welcome-form">
          <div id="key-setup-box" class="key-field-wrap hidden">
            <label for="api-key-input" class="field-caption">
              Passcode key
            </label>
            <input
              id="api-key-input"
              type="password"
              class="underline-input"
              placeholder="Paste key once"
              autocomplete="off"
            />
          </div>

          <div class="name-field-wrap">
            <label for="player-name-input" class="field-caption">
              Your name
            </label>
            <input
              id="player-name-input"
              type="text"
              class="underline-input"
              placeholder="e.g., Meera &amp; Aarav"
              maxlength="48"
              required
            />
          </div>

          <button id="start-submit-btn" type="submit" class="pill-btn pill-primary">
            Begin
          </button>
        </form>
      </section>

      <section id="screen-active" class="screen-flow screen-enter hidden">
        <div class="trail-bar">
          <div class="trail-progress-group">
            <div id="step-dots" class="step-dots" aria-hidden="true"></div>
            <span id="stop-counter" class="step-fraction"></span>
          </div>
          <button id="reset-run-btn" type="button" class="text-link">
            Start over
          </button>
        </div>

        <article class="clue-body">
          <h1 id="stop-heading" class="clue-title"></h1>
          <p id="stop-narrative" class="clue-story"></p>

          <figure id="clue-image-wrap" class="visual-clue hidden">
            <img id="clue-image" src="" alt="" />
            <figcaption id="clue-image-caption"></figcaption>
          </figure>

          <blockquote id="stop-riddle" class="clue-riddle"></blockquote>

          <p id="action-twist-box" class="twist-note hidden">
            <svg
              class="twist-star"
              width="14"
              height="14"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M8 1 L9.6 6.4 L15 8 L9.6 9.6 L8 15 L6.4 9.6 L1 8 L6.4 6.4 Z" />
            </svg>
            <span id="action-twist-text"></span>
          </p>

          <div class="hint-disclosure">
            <button id="nudge-btn" type="button" class="text-link hint-toggle">
              Need a hint?
            </button>
            <div id="hint-collapse" class="hint-collapse" aria-hidden="true">
              <div class="hint-collapse-inner">
                <p id="hint-text" class="hint-copy"></p>
              </div>
            </div>
          </div>
        </article>

        <div id="capture-controls" class="capture-actions">
          <input
            id="camera-input"
            type="file"
            accept="image/*"
            capture="environment"
            class="sr-file"
          />
          <input
            id="library-input"
            type="file"
            accept="image/*"
            class="sr-file"
          />
          <button id="take-photo-btn" type="button" class="pill-btn pill-primary">
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.65"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5l-2-3z" />
              <circle cx="12" cy="13" r="3.5" />
            </svg>
            <span>Take a photo</span>
          </button>
          <button id="library-photo-btn" type="button" class="text-link gallery-link">
            or choose from gallery
          </button>
        </div>

        <div id="preview-card" class="polaroid-wrap hidden">
          <div id="polaroid-frame" class="polaroid-frame">
            <div class="polaroid-photo-box">
              <img id="preview-img" src="" alt="Your photo for this clue" />
              <div id="checking-veil" class="checking-veil hidden" aria-live="polite">
                <div class="loading-dots">
                  <span></span><span></span><span></span>
                </div>
                <span>Looking closely...</span>
              </div>
            </div>
            <div class="polaroid-actions">
              <button id="clear-photo-btn" type="button" class="text-link">
                Retake
              </button>
              <button id="verify-photo-btn" type="button" class="pill-btn pill-primary pill-compact">
                Check photo
              </button>
            </div>
          </div>

          <div id="feedback-banner" class="nudge-reply hidden" role="status">
            <p id="feedback-text"></p>
          </div>
        </div>

        <div id="verified-banner" class="verified-moment hidden" role="status">
          <div class="seal-stage">
            <div class="petal-burst" aria-hidden="true">
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
            </div>
            <div class="wax-seal" aria-hidden="true">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m5 12.5 4.5 4.5L19 7.5" />
              </svg>
            </div>
          </div>

          <p id="verified-feedback" class="verified-reply"></p>
          <p id="verified-success-note" class="verified-subnote"></p>

          <p id="prop-reveal-box" class="prop-whisper hidden">
            <span id="prop-reveal-text"></span>
          </p>

          <aside id="interlude-card" class="interlude-note hidden">
            <p id="interlude-title" class="interlude-title"></p>
            <p id="interlude-text" class="interlude-body"></p>
          </aside>

          <button id="next-stop-btn" type="button" class="pill-btn pill-primary">
            Next clue
          </button>
        </div>
      </section>

      <section id="screen-completed" class="screen-flow screen-enter hidden">
        <div class="finale-header">
          <svg
            class="botanical-mark"
            viewBox="0 0 88 56"
            fill="none"
            aria-hidden="true"
          >
            <path
              class="sprig-stem"
              d="M12 44 C 28 38, 44 26, 74 14"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
            />
            <path
              class="sprig-leaf leaf-1"
              d="M28 36 C 24 27, 30 20, 38 24 C 36 31, 32 35, 28 36 Z"
              stroke="currentColor"
              stroke-width="1.1"
              stroke-linejoin="round"
            />
            <path
              class="sprig-leaf leaf-2"
              d="M44 27 C 46 17, 54 14, 58 21 C 53 26, 48 27, 44 27 Z"
              stroke="currentColor"
              stroke-width="1.1"
              stroke-linejoin="round"
            />
            <circle class="sprig-bud" cx="74" cy="14" r="2.4" fill="currentColor" />
          </svg>
          <h1 id="finale-title" class="editorial-title"></h1>
          <p id="finale-story" class="editorial-subtitle"></p>
        </div>

        <div class="finisher-card">
          <p class="finisher-kicker">Finisher Pass</p>
          <h2 id="finisher-name" class="finisher-guest"></h2>
          <p id="sleuth-badge" class="sleuth-note hidden">Solved with no hints</p>
          <p id="prize-instructions" class="finisher-instructions"></p>
          <div class="finisher-times">
            <span>Time <strong id="elapsed-time"></strong></span>
            <span>Finished <strong id="completed-at"></strong></span>
          </div>
        </div>

        <div id="keepsake-panel" class="keepsake-section hidden">
          <div id="keepsake-grid" class="keepsake-polaroids"></div>
          <button id="download-strip-btn" type="button" class="pill-btn pill-secondary">
            Save photo strip
          </button>
        </div>

        <div class="finale-footer-action">
          <button id="play-again-btn" type="button" class="text-link">
            Start a new trail
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
